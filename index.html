<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>신생대의 환경과 생물</title>
<style>
:root{--ink:#10243a;--sea:#1d6f8c;--ice:#cfeaf2;--sand:#efe0bd;--moss:#4f8a4b;--co:#e0614d;--bg:#f7f5ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Noto Sans KR','Malgun Gothic',sans-serif}
header{background:var(--ink);color:#fff;padding:34px 20px 20px;text-align:center}
header h1{margin:0;font-size:clamp(28px,6vw,48px);letter-spacing:-1px}header p{margin:6px 0 0;color:var(--ice)}
nav{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:8px;background:var(--ink);padding:0 10px 12px}
nav button{font:inherit;font-weight:700;border:0;border-radius:20px;padding:8px 22px;background:#27415c;color:#fff;cursor:pointer}
nav button.on{background:var(--sand);color:var(--ink)}
main{max-width:1000px;margin:auto;padding:16px}.tab{display:none}.tab.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
figure{margin:0;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px}
figure h2{margin:0 0 6px;font-size:18px}svg{width:100%;height:auto;display:block}
figcaption{font-size:15px;margin-top:6px}
.b{font:inherit;font-size:14px;margin:6px 6px 0 0;border:2px solid var(--ink);background:var(--sand);border-radius:8px;padding:3px 12px;cursor:pointer}
.more{display:none;background:var(--ice);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:14px}.more.on{display:block}
.wide{grid-column:1/-1}
.line{stroke-dasharray:1;stroke-dashoffset:1}.go .line{animation:draw 3.5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}.go .bar{animation:fill 2.5s forwards}
.go .bar.dn{animation:fill 1.2s forwards,shr 2.5s 1.4s forwards}
@keyframes fill{to{transform:scaleY(1)}}@keyframes shr{to{transform:scaleY(.4)}}
.wedge{transition:transform .5s;transform:translateY(-16px)}.wedge:hover,.wedge.p{animation:pulse 1s 2}
@keyframes pulse{50%{transform:translateY(-26px)}}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:swing .9s ease-in-out infinite alternate}
.leg.b2{animation-delay:-.45s}@keyframes swing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.bob{animation:bob .9s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-3px)}}
.gr{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}.go .gr{animation:fill 2.5s forwards}
.go .fl{animation:bloom 1s 2.4s both}.fl{transform-box:fill-box;transform-origin:center;transform:scale(0)}
@keyframes bloom{to{transform:scale(1)}}
.ground{animation:slide 2s linear infinite}@keyframes slide{to{transform:translateX(-40px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.cont{transition:transform 2.5s ease-in-out}.moh{opacity:0;transition:opacity 1s 2s}
.joined .ind{transform:translate(0,0)!important}.joined .afr{transform:translate(0,0)!important}.joined .moh{opacity:1}
.spear{transition:transform 1.2s}.hit .spear{transform:translateX(70px)}
.hunt .m1{transition:opacity 1.5s}.hit .m1{opacity:.15}
.fos{cursor:pointer}.fos:hover,.fos:focus{filter:drop-shadow(0 0 4px #fff)}
.warm .water{fill:#46c7c0}.warm .sun{opacity:1}.sun{opacity:0;transition:.8s}.water{transition:fill 1s}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cards div{border:2px solid var(--ink);border-radius:10px;padding:8px;background:#fff;cursor:pointer}
.cards b{display:block}.cards small{display:none}.cards .on small{display:block}.cards .on{background:var(--sand)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--ink);padding:6px;vertical-align:top}th{background:var(--sand)}
.q{margin:10px 0}.q label{display:block;cursor:pointer}.ok{color:var(--moss);font-weight:700}.no{color:var(--co);font-weight:700}
footer{background:var(--ink);color:var(--ice);padding:20px;font-size:14px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="mm"><g fill="#4a3022"><rect class="leg" x="28" y="50" width="9" height="26" rx="3"/><rect class="leg b2" x="70" y="50" width="9" height="26" rx="3"/></g>
<ellipse cx="62" cy="40" rx="40" ry="23" fill="#6b4a32"/><circle cx="26" cy="32" r="18" fill="#6b4a32"/><path d="M10 38q-12 14-4 32" stroke="#6b4a32" stroke-width="8" fill="none" stroke-linecap="round"/>
<path d="M18 46q-16 16 6 30" stroke="#f4ecd8" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="24" cy="30" r="2" fill="#000"/>
<path d="M45 58v10M60 60v12M78 58v9M92 54v8" stroke="#8a6444" stroke-width="3" stroke-linecap="round"/>
<g fill="#6b4a32"><rect class="leg b2" x="38" y="50" width="9" height="26" rx="3"/><rect class="leg" x="82" y="50" width="9" height="26" rx="3"/></g></g>
</defs></svg>
<header><h1>신생대의 환경과 생물</h1><p>그림을 클릭하고, 버튼을 눌러 보세요 · 통합과학</p></header>
<nav><button class="on" data-t="env">환경</button><button data-t="bio">생물</button><button data-t="fos">화석</button><button data-t="quiz">퀴즈</button></nav>
<main>
<!-- ================= 환경 ================= -->
<section class="tab on" id="env"><div class="grid">

<figure><h2>① 시대 구분</h2>
<svg viewBox="0 0 220 210"><circle cx="100" cy="106" r="70" fill="#9fb8c4"/><text x="100" y="116" text-anchor="middle" font-size="12" fill="#10243a">전체 지질 시대</text>
<path class="wedge" id="wd" d="M100 106L96.95 36.1A70 70 0 0 1 103.05 36.1Z" fill="#e0614d" stroke="#e0614d" stroke-width="2" onclick="this.classList.remove('p');void this.getBoundingClientRect();this.classList.add('p')"/>
<path d="M104 16L150 12" stroke="#e0614d"/><text x="152" y="14" font-size="12" font-weight="700" fill="#e0614d">신생대 1.4%</text></svg>
<figcaption>빨간 조각이 우리가 살고 있는 시대예요. 클릭!</figcaption>
<button class="b" onclick="this.nextElementSibling.classList.toggle('on')">설명</button><div class="more">신생대는 약 6,600만 년 전에 시작되어 현재까지 이어지고 있는 지질 시대입니다. 신생대는 전체 지질 시대의 약 1.4%를 차지한다.</div></figure>

<figure id="f2"><h2>② 기후</h2>
<svg viewBox="0 0 320 170"><path d="M10 10V150H310" stroke="#10243a" fill="none"/><text x="14" y="22" font-size="10">따뜻함</text><text x="14" y="146" font-size="10">차가움</text>
<path class="line" pathLength="1" d="M10 30C60 28 90 40 130 70S180 100 200 100L215 78 230 118 245 68 260 124 275 74 290 128 310 90" fill="none" stroke="#e0614d" stroke-width="3"/>
<text x="20" y="48" font-size="10" fill="#e0614d">초기: 온실 지구</text><text x="200" y="152" font-size="10" fill="#1d6f8c">빙하기↔간빙기 반복</text></svg>
<figcaption>(기온 변화의 개략적 경향을 나타낸 모식도)</figcaption>
<button class="b" onclick="rp('f2')">다시 그리기</button><button class="b" onclick="this.nextElementSibling.classList.toggle('on')">설명</button><div class="more">전반적인 기후: 신생대 초기는 온실 지구였다. 빙하기와 간빙기가 반복되었다.</div></figure>

<figure id="f3" class="wide"><h2>③ 대기·해양 환경</h2>
<svg viewBox="0 0 600 190"><g font-size="12" text-anchor="middle">
<rect x="40" y="30" width="60" height="120" fill="#e6eef3" stroke="#10243a"/><rect class="bar" x="40" y="30" width="60" height="120" fill="#4f8a4b"/><text x="70" y="168">산소</text><text x="70" y="22" fill="#10243a">현재와 비슷</text>
<rect x="200" y="30" width="60" height="120" fill="#e6eef3" stroke="#10243a"/><rect class="bar dn" x="200" y="30" width="60" height="120" fill="#e0614d"/><text x="230" y="168">이산화탄소</text><text x="230" y="22">높음→감소</text>
<text x="450" y="22">해수면·수온</text><rect x="340" y="30" width="220" height="120" fill="#e6eef3" stroke="#10243a"/>
<path class="line" pathLength="1" d="M345 45C390 45 410 60 430 80L450 60 470 100 490 70 510 115 530 85 555 120" fill="none" stroke="#1d6f8c" stroke-width="3"/>
<text x="450" y="168">초반 높음→빙하 발달, 크게 변동</text></g></svg>
<figcaption>막대가 차오르고, 이산화탄소는 줄어들어요. 오른쪽 선은 해수면의 변동!</figcaption>
<button class="b" onclick="rp('f3')">다시 보기</button><button class="b" onclick="this.nextElementSibling.classList.toggle('on')">설명</button><div class="more">산소: 대기 중 산소 농도가 현재와 비슷한 수준이었다.<br>이산화탄소: 초기에는 이산화탄소 농도가 높았지만 점차 감소하였다. → 지구의 기온이 전반적으로 낮아졌고 후반에는 빙하기가 나타났다.<br>바다: 초반에는 비교적 높은 수온과 해수면이 나타났지만 시간이 지나면서 남극과 북반구에 빙하가 발달하면서 해수면이 크게 변동하였다.</div></figure>

<figure id="f4" class="wide"><h2>④ 수륙 분포</h2>
<svg viewBox="0 0 400 210"><rect width="400" height="210" fill="#cfeaf2"/>
<g class="cont" fill="#c9b27a"><path d="M200 20Q260 0 340 20 380 50 350 90 300 100 250 90 200 70 200 20Z"/></g><text x="270" y="55" font-size="13">아시아</text>
<path d="M120 30Q160 15 190 35 185 60 150 65 120 60 120 30Z" fill="#b8a46c"/><text x="135" y="46" font-size="12">유럽</text>
<g class="cont afr" style="transform:translate(-5px,35px)"><path d="M100 90Q160 75 190 95 195 150 160 190 130 185 110 140 90 110 100 90Z" fill="#a8975f"/><text x="125" y="130" font-size="12">아프리카</text></g>
<g class="cont ind" style="transform:translate(-30px,60px)"><path d="M255 110L305 110 280 165Z" fill="#8f8a55"/><text x="262" y="130" font-size="11">인도</text></g>
<g class="moh" fill="#fff" stroke="#555"><path d="M262 100l9-18 9 18Z"/><path d="M290 100l9-18 9 18Z"/><path d="M155 62l7-14 7 14Z"/></g>
<text x="250" y="76" class="moh" font-size="10" fill="#10243a">히말라야</text><text x="140" y="80" class="moh" font-size="10" fill="#10243a">알프스</text></svg>
<figcaption>버튼을 눌러 대륙을 움직여 보세요.</figcaption>
<button class="b" onclick="this.closest('figure').classList.add('joined')">대륙 충돌·합치기</button><button class="b" onclick="this.closest('figure').classList.remove('joined')">처음 위치로 갈라지기</button><button class="b" onclick="this.nextElementSibling.classList.toggle('on')">설명</button><div class="more">대륙 배치: 초에는 현재와 비슷한 대륙 배치를 이루기 시작했다. 인도 대륙이 아시아와 충돌하고 아프리카가 유럽 쪽으로 이동하면서 현재와 비슷한 모습이 되었다.<br>지각 변동: 이동과 충돌로 히말라야산맥, 알프스산맥 등의 습곡 산맥이 형성되었다. 해저확장과 판의 충돌, 섭입도 활발하게 일어났다. 기후변화에도 영향을 주었다.</div></figure>
</div></section>

<!-- ================= 생물 ================= -->
<section class="tab" id="bio"><div class="grid">

<figure><h2>⑤ 대표 동물 — 매머드 (육상생물)</h2>
<svg viewBox="0 0 240 130"><rect width="240" height="130" fill="#dff1f7"/><rect y="100" width="240" height="30" fill="#fff"/>
<g class="ground" stroke="#9fb8c4" stroke-width="3"><path d="M0 110h20M60 118h20M120 110h20M180 118h20M240 110h20M-40 118h20"/></g>
<g class="bob"><use href="#mm" transform="translate(70 28)"/></g></svg>
<figcaption>두꺼운 털과 긴 엄니로 추운 초원을 걸어요. 클릭하면 이유가 나와요.</figcaption>
<button class="b" onclick="this.nextElementSibling.classList.toggle('on')">설명</button><div class="more">특징: 춥고 건조한 빙하기 환경에 적응해 긴 엄니와 두꺼운 털이 있는 코끼리의 친척임. 구분: 육상생물 — 육지에서 생활하며 풀이나 식물을 먹음.<br>번성 이유: 신생대 후기에 빙하기가 찾아오면서 기온이 낮고 건조한 초원 환경이 넓게 나타남. 매머드는 두꺼운 털과 피하지방을 가지고 있어 추운 환경에서도 살아남을 수 있었고, 넓은 초원에 매머드가 좋아하는 풀과 식물을 먹으며 번성할 수 있었음.</div></figure>

<figure id="f6"><h2>⑥ 대표 식물 — 속씨식물</h2>
<svg viewBox="0 0 260 170"><rect width="260" height="170" fill="#eef6e8"/><path d="M0 150H260" stroke="#5b4a30" stroke-width="6"/>
<g opacity=".55"><path d="M60 150V70" stroke="#5b4a30" stroke-width="5"/><path d="M60 40L35 85h50zM60 60L30 110h60z" fill="#3d6b44"/></g><text x="30" y="166" font-size="11">중생대: 겉씨식물</text>
<g class="gr"><path d="M180 150V80" stroke="#4f8a4b" stroke-width="5"/><path d="M180 120q-25-5-30-25 25 0 30 25zM180 105q25-5 30-25-25 0-30 25z" fill="#4f8a4b"/></g>
<g class="fl"><g fill="#e0614d"><circle cx="180" cy="68" r="9"/><circle cx="192" cy="80" r="9"/><circle cx="168" cy="80" r="9"/><circle cx="180" cy="90" r="9"/></g><circle cx="180" cy="79" r="6" fill="#f2c94c"/></g><text x="150" y="166" font-size="11">신생대: 속씨식물</text></svg>
<figcaption>아래에서 위로 자라 꽃이 피어요!</figcaption>
<button class="b" onclick="rp('f6')">다시 자라기</button><button class="b" onclick="this.nextElementSibling.classList.toggle('on')">설명</button><div class="more">특징: 씨가 열매 안에 들어있고 꽃이 피는 식물이 대부분임. 곤충 등 꽃가루받이를 함. 현재 지구에서 가장 번성한 식물군임.<br>변화: 이전 시대인 중생대에는 겉씨식물이 주로 번성했지만 신생대에는 꽃과 열매를 가진 속씨식물이 크게 번성하여 식물의 종류와 생태계가 더욱 다양해짐.</div></figure>

<figure id="f8" class="wide hunt"><h2>⑧ 시대 말 사건 — 대형 포유류의 대멸종</h2>
<svg viewBox="0 0 520 170"><rect width="520" height="170" fill="#f3ecd9"/>
<g class="m1"><use href="#mm" transform="translate(190 40) scale(.9)"/></g>
<g stroke="#10243a" stroke-width="3" fill="none" stroke-linecap="round"><circle cx="40" cy="80" r="8" fill="#e8b88a"/><path d="M40 88v35M40 100l-14 14M40 100l14 8M40 123l-12 24M40 123l12 24"/><g class="spear"><path d="M52 94H104"/><path d="M104 90l10 4-10 4z" fill="#10243a"/></g></g>
<text x="14" y="164" font-size="11">인류(과잉 사냥)</text>
<g font-size="11" text-anchor="middle"><rect x="360" y="20" width="40" height="110" fill="#6b4a32"/><rect x="430" y="20" width="40" height="110" fill="#e6eef3" stroke="#10243a"/><rect class="bar dn" x="430" y="20" width="40" height="110" fill="#6b4a32" style="transform-origin:bottom"/>
<text x="380" y="146">5만 년 전</text><text x="450" y="146">현재</text><text x="415" y="14" fill="#e0614d">92~95% 감소</text></g></svg>
<figcaption>사냥이 늘수록 큰 동물이 사라져요. 창을 던져 보세요.</figcaption>
<button class="b" onclick="var f=this.closest('figure');f.classList.remove('hit');f.classList.add('go');void f.offsetWidth;f.classList.add('hit')">창 던지기</button><button class="b" onclick="this.nextElementSibling.classList.toggle('on')">설명</button><div class="more">사건: 대형 포유류의 대멸종으로 인해 북미의 매머드, 마스토돈, 검치호랑이 등 몸무게 44kg 이상의 대형 동물들이 지구상에서 대부분 사라졌다. 지난 5만 년 동안 전 세계 대형 동물 개체 수와 생물량은 92에서 95%나 감소했다.<br>원인: 인류의 과잉 사냥 — 현생 인류가 전 지구로 확산하면서 대형 동물을 남획한 것이 멸종의 주원인이라는 가설이다. 최근 데이터 분석에 따르면 인구 증가와 대형 동물 감소 사이의 높은 상관관계, 약 96%의 예측력이 확인되었다.</div></figure>

<figure class="wide"><h2>⑩ 환경 변화 → 생물 변화</h2>
<svg viewBox="0 0 560 190"><g font-size="12" text-anchor="middle"><rect width="270" height="190" fill="#ecf5ea"/><rect x="290" width="270" height="190" fill="#f3ecd9"/>
<text x="135" y="18" font-weight="700">원인: 냉각화·건조</text><text x="425" y="18" font-weight="700">결과: 말의 진화</text>
<g fill="#3d6b44"><path d="M30 120l20-60 20 60zM70 120l20-70 20 70z"/></g><text x="70" y="140">울창한 숲</text>
<path d="M120 90h40" stroke="#e0614d" stroke-width="3"/><path d="M158 84l10 6-10 6z" fill="#e0614d"/>
<path d="M180 125q20-20 30 0 15-25 30 0 10-15 25 0V130H180z" fill="#9bc15a"/><text x="215" y="150">광활한 초원</text>
<g stroke="#4a3022" stroke-width="5" stroke-linecap="round" fill="none"><path d="M330 60v50M330 110l-12 16M330 110v18M330 110l12 16"/><path d="M450 60v50"/><path d="M450 110v18" stroke-width="9"/></g>
<text x="330" y="150">발가락 여러 개</text><text x="450" y="150">발가락 수 감소</text><path d="M360 100h60" stroke="#e0614d" stroke-width="3"/><path d="M418 94l10 6-10 6z" fill="#e0614d"/><text x="425" y="176">빨리 도망치기 위해</text></g></svg>
<figcaption>숲이 줄고 초원이 생기자 말의 다리가 달라졌어요.</figcaption>
